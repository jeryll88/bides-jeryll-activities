  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>JavaScript Loops | IT Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>

    <div class="container">
      <h2>JavaScript Loop Demonstration</h2>
      <div class="subtitle">BSIT • Control Structures • Looping Statements</div>

      <div class="buttons">
        <button onclick="forLoop()">for</button>
        <button onclick="whileLoop()">while</button>
        <button onclick="doWhileLoop()">do...while</button>
        <button onclick="forOfLoop()">for...of</button>
        <button onclick="forInLoop()">for...in</button>
        <button onclick="forEachLoop()">forEach</button>
        <button class="clear-btn" onclick="output.textContent=''">clear</button>
      </div>

      <pre id="output"><span class="prompt">$</span> click a loop to execute...</pre>
    </div>

    <script src="./js/loops.js"></script>

  </body>
  </html>
