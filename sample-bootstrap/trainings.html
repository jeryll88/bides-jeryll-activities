<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trainings | Employee Information System</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="./css/trainings.css">
<script src="./js/activity_logger.js"></script>
</head>

<body>
<div class="top-header">EMPLOYEE INFORMATION SYSTEM</div>

<div class="container-fluid mt-4">
  <div class="info-card">
    <h2 class="system-title text-center mb-4">TRAININGS</h2>

    <!-- Back Button -->
    <div class="mb-3">
      <button class="btn btn-secondary" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
    </div>

    <!-- Search + Add -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
      <div class="flex-grow-1 me-2">
        <input type="text" class="form-control search-input" placeholder="Search Trainings" id="searchInput">
      </div>
      <button class="btn add-btn" onclick="showAddTrainingForm()">
        <i class="fa-solid fa-plus"></i> Add
      </button>
    </div>

    <!-- Trainings Table -->
    <div class="table-responsive">
      <table class="table-custom text-center align-middle" id="trainingsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Add Training Form -->
    <div id="addTrainingForm" style="display:none; margin-top:20px;">
      <h5>Add Training</h5>
      <div class="mb-2">
        <input type="text" id="trainingTitle" class="form-control" placeholder="Training Title">
      </div>
      <div class="mb-2">
        <input type="date" id="trainingDate" class="form-control">
      </div>
      <button class="btn btn-success" onclick="saveTraining()">Save Training</button>
      <button class="btn btn-secondary" onclick="hideAddTrainingForm()">Cancel</button>
    </div>

  </div>
</div>

<script>

const employee = JSON.parse(localStorage.getItem('currentEmployee'));

function goBack() {
    if(employee && employee.id){
        window.location.href = `employee_info.html?id=${employee.id}`;
    } else {
        window.location.href = "employee_info.html";
    }
}

function showAddTrainingForm() {
    document.getElementById('addTrainingForm').style.display = 'block';
}

function hideAddTrainingForm() {
    document.getElementById('addTrainingForm').style.display = 'none';
}

let trainings = JSON.parse(localStorage.getItem('trainings')) || [];
const tableBody = document.querySelector("#trainingsTable tbody");

function renderTrainings(list = trainings){

  tableBody.innerHTML = '';

  if(list.length === 0){
    tableBody.innerHTML = `<tr><td colspan="4">No trainings yet</td></tr>`;
    return;
  }

  list.forEach(t => {

    tableBody.innerHTML += `
      <tr>
        <td>${t.id}</td>
        <td>${t.title}</td>
        <td>${t.date}</td>
        <td>
          <a href="edit_training.html?id=${t.id}" class="btn btn-sm btn-warning mb-1">
            <i class="fa-solid fa-pen"></i> Edit
          </a>
          <button class="btn btn-sm btn-danger" onclick="deleteTraining('${t.id}','${t.title}')">
            <i class="fa-solid fa-trash"></i> Delete
          </button>
        </td>
      </tr>
    `;

  });

}

function deleteTraining(id, title){
  if(confirm("Are you sure you want to delete this training?")){
    trainings = trainings.filter(t => String(t.id) !== String(id));
    localStorage.setItem('trainings', JSON.stringify(trainings));
    logActivity("Deleted Training", title);
    renderTrainings();
  }
}

document.getElementById('searchInput').addEventListener('input', function(){
  const search = this.value.toLowerCase();

  const filtered = trainings.filter(t =>
    t.title.toLowerCase().includes(search) ||
    t.date.includes(search)
  );

  renderTrainings(filtered);
});

function saveTraining() {

    const title = document.getElementById('trainingTitle').value.trim();
    const date = document.getElementById('trainingDate').value;

    if(!title || !date){
        alert("Please enter title and date.");
        return;
    }

    if(!employee || !employee.id){
        alert("No employee selected.");
        return;
    }

    const newTraining = {
        id: employee.id,
        empId: employee.id,
        title: title,
        date: date
    };

    trainings.push(newTraining);
    localStorage.setItem('trainings', JSON.stringify(trainings));

    logActivity("Added Training", title);

    renderTrainings();
    hideAddTrainingForm();

    document.getElementById('trainingTitle').value = '';
    document.getElementById('trainingDate').value = '';
}

renderTrainings();

</script>

<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
