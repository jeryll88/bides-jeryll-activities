<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Information</title>

<!-- Bootstrap 5 -->
<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/info.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- Top Header -->
    <div class="top-header">
        EMPLOYEE INFORMATION SYSTEM
    </div>

    <div class="container-fluid">
        <div class="row justify-content-center">

            <div class="col-md-9 col-lg-10 content-area">
                <div class="info-card text-center">

                    <!-- Back Button -->
                    <div class="text-start mb-3">
                        <button class="btn btn-secondary" onclick="goBack()">
                            <i class="fa-solid fa-arrow-left"></i> Back
                        </button>
                    </div>

                    <!-- Card Title -->
                    <h2 class="system-title">
                        EMPLOYEE INFORMATION SYSTEM
                    </h2>

                    <!-- Employee Details -->
                    <div class="employee-number mb-4">
                        Employee No: <strong id="empNumber"></strong>
                    </div>

                    <hr class="divider">

                    <div class="row text-start mt-4">
                        <div class="col-md-6 mb-3">
                            <label class="label-title">Last Name</label>
                            <div class="info-value" id="lastName"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="label-title">First Name</label>
                            <div class="info-value" id="firstName"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="label-title">Birthday</label>
                            <div class="info-value" id="birthday"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="label-title">Status</label>
                            <div class="info-value" id="status"></div>
                        </div>
                    </div>
                </div>

                <!-- Sidebar Buttons -->
                <div class="sidebar mt-4">
                    <button class="btn" onclick="goToTrainings()">
                        <i class="fa-solid fa-camera"></i> Trainings
                    </button>
                    <button class="btn" onclick="goToServiceRecords()">
                        <i class="fa-solid fa-clock-rotate-left"></i> Service Records
                    </button>
                </div>
            </div>
        </div>
    </div>

<script src="./js/employee_info.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
