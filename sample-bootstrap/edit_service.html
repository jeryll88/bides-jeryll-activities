<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Service Record</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/edit_service.css"> <!-- Additional CSS for edit page -->
</head>
<body>

<div class="top-header">
    EMPLOYEE INFORMATION SYSTEM
</div>

<div class="container">
    <div class="info-card">
        <h3>Edit Service Record</h3>

        <div class="mb-3">
            <label>Position</label>
            <input type="text" id="position" class="form-control">
        </div>

        <div class="mb-3">
            <label>Start Date</label>
            <input type="date" id="start" class="form-control">
        </div>

        <div class="mb-3">
            <label>End Date</label>
            <input type="date" id="end" class="form-control">
        </div>

        <button class="btn btn-success" onclick="updateService()">Update</button>
        <button class="btn btn-secondary" onclick="goBack()">Cancel</button>
    </div>
</div>

<script src="./js/edit_service.js"></script>

<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
