<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Service Record</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./css/edit_service.css"> <!-- Additional CSS for edit page -->
</head>
<body>

<div class="top-header">
    EMPLOYEE INFORMATION SYSTEM
</div>

<div class="container">
    <div class="info-card">
        <h3>Edit Service Record</h3>

        <div class="mb-3">
            <label>Position</label>
            <input type="text" id="position" class="form-control">
        </div>

        <div class="mb-3">
            <label>Start Date</label>
            <input type="date" id="start" class="form-control">
        </div>

        <div class="mb-3">
            <label>End Date</label>
            <input type="date" id="end" class="form-control">
        </div>

        <button class="btn btn-success" onclick="updateService()">Update</button>
        <button class="btn btn-secondary" onclick="goBack()">Cancel</button>
    </div>
</div>

<script>
const employee = JSON.parse(localStorage.getItem("currentEmployee"));
let services = JSON.parse(localStorage.getItem("services")) || [];
const editIndex = localStorage.getItem("editServiceIndex");

if(editIndex === null){
    alert("No service selected to edit.");
    window.location.href = "service_records.html";
}

// Pre-fill input fields
const s = services[editIndex];
document.getElementById("position").value = s.position;
document.getElementById("start").value = s.start;
document.getElementById("end").value = s.end;

// Go back
function goBack(){
    window.location.href = "service_records.html";
}

// Update
function updateService(){
    const position = document.getElementById("position").value;
    const start = document.getElementById("start").value;
    const end = document.getElementById("end").value;

    if(!position || !start || !end){
        alert("Please complete the form");
        return;
    }

    services[editIndex] = {
        id: employee.id,
        position: position,
        start: start,
        end: end
    };

    localStorage.setItem("services", JSON.stringify(services));
    alert("Service Record Updated");
    window.location.href = "service_record.html";
}
</script>

<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
