<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Employee Information System</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="./css/dashboard.css">
<script src="./js/activity_logger.js"></script>

</head>

<body>

<!-- LOGIN PROTECTION -->
<script>
if(!sessionStorage.getItem("auth")){
    window.location.replace("login.html");
}
</script>

<div class="content container-fluid">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">

<h2 class="system-title">
<i class="bi bi-building"></i> Employee Information System
</h2>

<button class="btn-logout" onclick="logout()">Logout</button>

</div>

<!-- Navigation -->
<div class="row g-3 mb-4">
<div class="col-md-2">
<a href="dashboard.html" class="nav-box nav-active text-white text-decoration-none d-block text-center">
DASHBOARD
</a>
</div>

<div class="col-md-2">
<a href="employee_list.html" class="nav-box text-white text-decoration-none d-block text-center">
EMPLOYEES
</a>
</div>
</div>

<!-- Statistics -->
<div class="row g-4 mb-5">

<div class="col-md-3">
<div class="glass-card stat-box stat-active">
<i class="bi bi-person-check fs-3"></i>
<div class="mt-2">ACTIVE EMPLOYEES</div>
<div class="stat-number" id="activeCount">0</div>
</div>
</div>

<div class="col-md-3">
<div class="glass-card stat-box stat-permanent">
<i class="bi bi-person-badge fs-3"></i>
<div class="mt-2">PERMANENT</div>
<div class="stat-number" id="permanentCount">0</div>
</div>
</div>

<div class="col-md-3">
<div class="glass-card stat-box stat-temporary">
<i class="bi bi-person fs-3"></i>
<div class="mt-2">TEMPORARY</div>
<div class="stat-number" id="temporaryCount">0</div>
</div>
</div>

<div class="col-md-3">
<div class="glass-card stat-box stat-separated">
<i class="bi bi-person-dash fs-3"></i>
<div class="mt-2">SEPARATED</div>
<div class="stat-number" id="separatedCount">0</div>
</div>
</div>

</div>

<!-- Recent Activities -->
<div class="glass-card">

<div class="d-flex justify-content-between align-items-center mb-3">
<h5>Recent Activities</h5>

<button class="btn btn-danger btn-sm" onclick="clearActivities()">
<i class="bi bi-trash"></i> Clear Activities
</button>

</div>

<div class="table-responsive">

<table class="custom-table">

<thead>
<tr>
<th>ID</th>
<th>Activity</th>
<th>Employee</th>
<th>Date</th>
</tr>
</thead>

<tbody id="recentActivities">
<tr>
<td colspan="4">No recent activities yet</td>
</tr>
</tbody>

</table>

</div>
</div>

</div>


<script>

function logout(){

if(confirm("Are you sure you want to logout?")){

sessionStorage.removeItem("auth");

window.location.replace("login.html");

}

}


/* LOAD DASHBOARD DATA */

document.addEventListener("DOMContentLoaded", function(){

loadEmployeeStats();
loadActivities();

});


/* EMPLOYEE STATISTICS */

function loadEmployeeStats(){

let employees = JSON.parse(localStorage.getItem("employees")) || [];

let active = 0;
let permanent = 0;
let temporary = 0;
let separated = 0;

employees.forEach(emp => {

if(emp.status === "Active"){
active++;
}

if(emp.status === "Permanent"){
permanent++;
}

if(emp.status === "Temporary"){
temporary++;
}

if(emp.status === "Separated"){
separated++;
}

});

document.getElementById("activeCount").textContent = active;
document.getElementById("permanentCount").textContent = permanent;
document.getElementById("temporaryCount").textContent = temporary;
document.getElementById("separatedCount").textContent = separated;

}


/* LOAD RECENT ACTIVITIES */

function loadActivities(){

let activities = JSON.parse(localStorage.getItem("activities")) || [];

const table = document.getElementById("recentActivities");

table.innerHTML = "";

if(activities.length === 0){

table.innerHTML = `
<tr>
<td colspan="4">No recent activities yet</td>
</tr>
`;

return;

}

activities.slice().reverse().forEach((act,index)=>{

table.innerHTML += `
<tr>
<td>${index + 1}</td>
<td>${act.activity}</td>
<td>${act.employee}</td>
<td>${act.date}</td>
</tr>
`;

});

}


/* DELETE ALL ACTIVITIES */

function clearActivities(){

if(confirm("Delete all recent activities?")){

localStorage.removeItem("activities");

loadActivities();

}

}

</script>


<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
