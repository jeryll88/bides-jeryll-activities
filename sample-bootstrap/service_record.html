<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Service Records</title>

<link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="./css/service.css">

</head>
<body>

<div class="top-header">
EMPLOYEE INFORMATION SYSTEM
</div>

<div class="container-fluid mt-4">

<div class="info-card">

<h2 class="system-title text-center mb-4">
SERVICE RECORDS
</h2>

<!-- Back + Add Buttons -->
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">

<button class="btn btn-secondary" onclick="goBack()">
<i class="fa-solid fa-arrow-left"></i> Back
</button>

<button class="btn add-btn" onclick="addService()">
<i class="fa-solid fa-plus"></i> Add
</button>

</div>

<div class="table-responsive">
<table class="table-custom text-center align-middle" id="serviceTable">

<thead>
<tr>
<th>ID</th>
<th>Position</th>
<th>Start</th>
<th>End</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>
</div>

</div>
</div>

<script src="./js/service_record.js"></script>

<script src="./bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
